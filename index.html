<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lab1</title>
  <style>
    .color-picker-container {
      padding: 15px;
      width: 256px;
      border: 1px solid rgb(0, 0, 0);
      padding: 10px;
      gap: 5px;
    }
    canvas {
      cursor: crosshair;
      border: 1px solid rgb(0, 0, 0);
    }
    .hue-slider {
      -webkit-appearance: none;
      width: 100%;
      background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      border: 1px solid rgb(0, 0, 0);
    }
    .hue-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: rgb(255, 253, 253);
      border: 1px solid rgb(5, 4, 4);
      cursor: pointer;
    }
    .color-preview {
      height: 40px;
      width: 40px;
      border: 1px solid rgb(0, 0, 0);
    }
    .main-input-block {
      display: flex;
      align-items: center;
    }
    .inputs-block {
      height: 280px;
      width: 256px;
      border: 1px solid rgb(0, 0, 0);
      padding: 10px;
    }
    .input-block {
      border: 1px solid rgb(0, 0, 0);
      padding: 10px;
      gap: 5px;

    }
    input {
      margin-left: 0px;
      margin-top: 1px;
    }
    input[type="range"] {
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="color-picker-container">
  <canvas id="colorCanvas" width="256" height="256"></canvas>
  <input type="range" id="hueSlider" class="hue-slider" min="0" max="360" value="0">
  <div id="colorPreview" class="color-preview"></div>
</div>
<div class="main-input-block">
  <div class="inputs-block">
    <div class="input-block">
      R:<input id="inRGBRed" type="text" size="1"/>
      <input id="slRGBRed" type="range" min="0" max="255" value="0">
    </div>
    <div class="input-block">
      G:<input id="inRGBGreen" type="text" size="1"/>
      <input id="slRGBGreen" type="range" min="0" max="255" value="0">
    </div>
    <div class="input-block">
      B:<input id="inRGBBlue" type="text" size="1"/><br>
      <input id="slRGBBlue" type="range" min="0" max="255" value="0">
    </div>
  </div>
  <div class="inputs-block">
    <div class="input-block">
      C:<input id="inCMYKCyan" type="text" size="1"/>%
      <input id="slCMYKCyan" type="range" min="0" max="100" value="0">
    </div>
    <div class="input-block">
      M:<input id="inCMYKMagenta" type="text" size="1"/>%
      <input id="slCMYKMagenta" type="range" min="0" max="100" value="0">
    </div>
    <div class="input-block">
      Y:<input id="inCMYKYellow" type="text" size="1"/>%<br>
      <input id="slCMYKYellow" type="range" min="0" max="100" value="0">
    </div>
    <div class="input-block">
      K:<input id="inCMYKKey" type="text" size="1"/>%<br>
      <input id="slCMYKKey" type="range" min="0" max="100" value="0">
    </div>
  </div>
  <div class="inputs-block">
    <div class="input-block">
      H:<input id="inHSVHue" type="text" size="1"/>&#176;
      <input id="slHSVHue" type="range" min="0" max="360" value="0">
    </div>
    <div class="input-block">
      S:<input id="inHSVSaturation" type="text" size="1"/>%
      <input id="slHSVSaturation" type="range" min="0" max="100" value="0">
    </div>
    <div class="input-block">
      V:<input id="inHSVValue" type="text" size="1"/>%
      <input id="slHSVValue" type="range" min="0" max="100" value="0">
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('colorCanvas');
  const ctx = canvas.getContext('2d');
  const hueSlider = document.getElementById('hueSlider');
  const colorPreview = document.getElementById('colorPreview');
  
  const syncUI = (idIn, idSl, val) => {
    const input = document.getElementById(idIn);
    const slider = document.getElementById(idSl);
    if (input && slider) {
      input.value = val;
      slider.value = val;
    }
  }

  let currentHue = 0;
  let lastX = canvas.width - 1;
  let lastY = 0;
  let isDrawing = false;

  function drawPalette(hue) {
    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const whiteGrad = ctx.createLinearGradient(0, 0, canvas.width, 0);
    whiteGrad.addColorStop(0, 'rgba(255,255,255,1)');
    whiteGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = whiteGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const blackGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    blackGrad.addColorStop(0, 'rgba(0,0,0,0)');
    blackGrad.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = blackGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  function updateColor(x, y) {
    x = Math.max(0, Math.min(x, canvas.width - 1));
    y = Math.max(0, Math.min(y, canvas.height - 1));
    lastX = x;
    lastY = y;
    
    const imgData = ctx.getImageData(x, y, 1, 1).data;

    let rByte = imgData[0];
    let gByte = imgData[1];
    let bByte = imgData[2];
    
    const rgbColor = `rgb(${rByte}, ${gByte}, ${bByte})`;
    colorPreview.style.backgroundColor = rgbColor;
    
    syncUI('inRGBRed', 'slRGBRed', rByte);
    syncUI('inRGBGreen', 'slRGBGreen', gByte);
    syncUI('inRGBBlue', 'slRGBBlue', bByte);

    const r = rByte / 255;
    const g = gByte / 255;
    const b = bByte / 255;

    fromRGBtoCMYK(r, g, b);
    fromRGBtoHSV(r, g, b);
  }

  hueSlider.addEventListener('input', (e) => {
    currentHue = e.target.value;
    drawPalette(currentHue);
    updateColor(lastX, lastY);
  });

  function fromRGBtoCMYK(r, g, b){
    inCMYKKey.value = 1 - Math.max(r, g, b);
    kVal = Math.floor(100 * inCMYKKey.value);

    cVal = inCMYKKey.value >= 0.98 ? 0 : Math.floor(100 * (1 - r - inCMYKKey.value) / (1 - inCMYKKey.value));
    mVal = inCMYKKey.value >= 0.98 ? 0 : Math.floor(100 * (1 - g - inCMYKKey.value) / (1 - inCMYKKey.value));
    yVal = inCMYKKey.value >= 0.98 ? 0 : Math.floor(100 * (1 - b - inCMYKKey.value) / (1 - inCMYKKey.value));

    syncUI('inCMYKCyan', 'slCMYKCyan', cVal);
    syncUI('inCMYKMagenta', 'slCMYKMagenta', mVal);
    syncUI('inCMYKYellow', 'slCMYKYellow', yVal);
    syncUI('inCMYKKey', 'slCMYKKey', kVal);
  }
  function fromRGBtoHSV(r, g, b){
    firstMax = Math.max(r, g, b);
    firstMin = Math.min(r, g, b);
    delta = firstMax - firstMin;

    vVal = Math.floor(100 * firstMax);
    sVal = firstMax === 0 ? 0 : Math.floor(100 * (delta / firstMax));

    syncUI('inHSVValue', 'slHSVValue', vVal);
    syncUI('inHSVSaturation', 'slHSVSaturation', sVal);
    
    hVal = 0;
    if (delta > 0.005){
      if (firstMax == r){
        hVal = Math.floor(((g - b) / delta + (g < b ? 6 : 0)) * 60);
      }
      else{
        if (firstMax == g){
          hVal = Math.floor(((b - r) / delta + 2) * 60);
        }
        else{
          hVal = Math.floor(((r - g) / delta + 4) * 60);
        }
      }
      if (hVal < 0){
        hVal += 360;
      }
      if (hVal >= 360){
        hVal -= 360;
      }
    }
    syncUI('inHSVHue', 'slHSVHue', hVal);
  }
  function fromRGBtoHSL(r, g, b){
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const delta = max - min;
    const l = (max + min) / 2;
    const s = delta === 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
    let h = 0
    if (delta > 0) {
      if (max === r) h = ((g - b) / delta + (g < b ? 6 : 0)) * 60;
      else if (max === g) h = ((b - r) / delta + 2) * 60;
      else h = ((r - g) / delta + 4) * 60;
    }
    const hFromHSL = Math.round(h);
    hueSlider.value = hFromHSL;
    drawPalette(hFromHSL);
  }

  function fromRGBtoOthers(inR, inG, inB){
    r = inR / 255;
    g = inG / 255;
    b = inB / 255;
    fromRGBtoHSL(r, g, b);
    fromRGBtoCMYK(r, g, b);
    fromRGBtoHSV(r, g, b);
    const rgbColor = `rgb(${inR}, ${inG}, ${inB})`;
    colorPreview.style.backgroundColor = rgbColor;
  }
  function fromCMYKtoOthers(inC, inM, inY, inK){
    r = (1 - inC / 100) * (1 - inK / 100);
    g = (1 - inM / 100) * (1 - inK / 100);
    b = (1 - inY / 100) * (1 - inK / 100);
    rByte = Math.floor(r * 255);
    gByte = Math.floor(g * 255);
    bByte = Math.floor(b * 255);
    syncUI('inRGBRed', 'slRGBRed', rByte);
    syncUI('inRGBGreen', 'slRGBGreen', gByte);
    syncUI('inRGBBlue', 'slRGBBlue', bByte);
    fromRGBtoHSL(r, g, b);
    fromRGBtoHSV(r, g, b);
    const rgbColor = `rgb(${rByte}, ${gByte}, ${bByte})`;
    colorPreview.style.backgroundColor = rgbColor;
  }
  function fromHSVtoOthers(inH, inS, inV){
    const h = inH;
    const s = inS / 100;
    const v = inV / 100;
    const k = (n) => (n + h / 60) % 6;
    const f = (n) => v - v * s * Math.max(0, Math.min(k(n), 4 - k(n), 1));
    rByte = Math.floor(f(5) * 255);
    gByte = Math.floor(f(3) * 255);
    bByte = Math.floor(f(1) * 255);
    const r = rByte / 255;
    const g = gByte / 255;
    const b = bByte / 255;
    syncUI('inRGBRed', 'slRGBRed', rByte);
    syncUI('inRGBGreen', 'slRGBGreen', gByte);
    syncUI('inRGBBlue', 'slRGBBlue', bByte);
    fromRGBtoHSL(r, g, b);
    fromRGBtoCMYK(r, g, b);
    const rgbColor = `rgb(${rByte}, ${gByte}, ${bByte})`;
    colorPreview.style.backgroundColor = rgbColor;
  }
  
  const inputsConfig = [
    ['inRGBRed', 'slRGBRed', () => fromRGBtoOthers(getVal('inRGBRed'), getVal('inRGBGreen'), getVal('inRGBBlue'))],
    ['inRGBGreen', 'slRGBGreen', () => fromRGBtoOthers(getVal('inRGBRed'), getVal('inRGBGreen'), getVal('inRGBBlue'))],
    ['inRGBBlue', 'slRGBBlue', () => fromRGBtoOthers(getVal('inRGBRed'), getVal('inRGBGreen'), getVal('inRGBBlue'))],
    
    ['inCMYKCyan', 'slCMYKCyan', () => fromCMYKtoOthers(getVal('inCMYKCyan'), getVal('inCMYKMagenta'), getVal('inCMYKYellow'), getVal('inCMYKKey'))],
    ['inCMYKMagenta', 'slCMYKMagenta', () => fromCMYKtoOthers(getVal('inCMYKCyan'), getVal('inCMYKMagenta'), getVal('inCMYKYellow'), getVal('inCMYKKey'))],
    ['inCMYKYellow', 'slCMYKYellow', () => fromCMYKtoOthers(getVal('inCMYKCyan'), getVal('inCMYKMagenta'), getVal('inCMYKYellow'), getVal('inCMYKKey'))],
    ['inCMYKKey', 'slCMYKKey', () => fromCMYKtoOthers(getVal('inCMYKCyan'), getVal('inCMYKMagenta'), getVal('inCMYKYellow'), getVal('inCMYKKey'))],
    
    ['inHSVHue', 'slHSVHue', () => fromHSVtoOthers(getVal('inHSVHue'), getVal('inHSVSaturation'), getVal('inHSVValue'))],
    ['inHSVSaturation', 'slHSVSaturation', () => fromHSVtoOthers(getVal('inHSVHue'), getVal('inHSVSaturation'), getVal('inHSVValue'))],
    ['inHSVValue', 'slHSVValue', () => fromHSVtoOthers(getVal('inHSVHue'), getVal('inHSVSaturation'), getVal('inHSVValue'))]
  ];

  function getVal(id) { return document.getElementById(id)?.value || 0; }

  inputsConfig.forEach(([inputId, sliderId, updateFunction]) => {
    const input = document.getElementById(inputId);
    const slider = document.getElementById(sliderId);
    input.addEventListener('input', () =>{
      let cleanVal = input.value.replace(/\D/g, '');
      if (cleanVal === '') cleanVal = '0';
      let num = parseInt(cleanVal, 10);
      const min = parseInt(slider.min, 10) || 0;
      const max = parseInt(slider.max, 10) || 100;
      if (num < min) num = min;
      if (num > max) num = max;
      input.value = num;
      slider.value = num;
      updateFunction();
    });

    slider.addEventListener('input', () =>{
      input.value = slider.value;
      updateFunction();
    });
  });

  function handleCanvasPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    updateColor(x, y);
  }

  let ticking = false;
  const MIN_DELTA = 3;

  canvas.addEventListener('mousedown', (e) => {
    isDrawing = true;
    lastX = e.clientX;
    lastY = e.clientY;
    handleCanvasPointer(e);
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;
    const deltaX = e.clientX - lastX;
    const deltaY = e.clientY - lastY;
    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
    if (distance > MIN_DELTA && !ticking) {
      window.requestAnimationFrame(() => {
        handleCanvasPointer(e);
        lastX = e.clientX;
        lastY = e.clientY;
        ticking = false;
      });
      ticking = true;
    }
  });

  canvas.addEventListener('mouseup', () => {
    isDrawing = false;
    ticking = false;
  });

  drawPalette(currentHue);
  updateColor(lastX, lastY);
</script>

</body>
</html>
